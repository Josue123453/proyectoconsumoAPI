<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DogFinder - Buscador de Perros</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">

    <div>

        <!-- ENCABEZADO -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50 backdrop-blur-md bg-white/90">

            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

                <div class="flex items-center space-x-3">

                    <div
                        class="bg-indigo-600 p-3 rounded-xl text-white shadow-md shadow-indigo-200 inline-flex items-center justify-center">

                        <i data-lucide="paw-print" class="w-8 h-8"></i>

                    </div>

                    <div>

                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">
                            Buscador de razas caninas
                        </h1>

                        <p class="text-xs text-slate-500 font-medium">
                            Encuentra a tu peludo ideal
                        </p>

                    </div>

                </div>

                <span
                    class="text-xs font-semibold bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full border border-indigo-100">

                    Uso de la API Dog API

                </span>

            </div>

        </header>


        <!-- CONTENEDOR DE LA APLICACIÓN -->
        <main class="max-w-6xl mx-auto px-4 py-8 w-full">


            <!-- PANEL DE CONTROLES -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 items-end">


                    <!-- SELECTOR DE RAZA -->
                    <div>

                        <label
                            for="breed-select"
                            class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">

                            Raza de Perro

                        </label>

                        <div class="relative">

                            <select
                                id="breed-select"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-4 pr-10 py-3 text-slate-700 font-medium appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer">

                                <option value="">
                                    Cargando razas...
                                </option>

                            </select>


                            <div
                                class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">

                                <svg
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor">

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M19 9l-7 7-7-7" />

                                </svg>

                            </div>

                        </div>

                    </div>


                    <!-- SELECTOR DE CANTIDAD -->
                    <div>

                        <label
                            for="limit-select"
                            class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">

                            Cantidad a Mostrar

                        </label>

                        <div class="relative">

                            <select
                                id="limit-select"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-4 pr-10 py-3 text-slate-700 font-medium appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer">

                                <option value="2" selected>
                                    2 imágenes
                                </option>

                                <option value="4">
                                    4 imágenes
                                </option>

                                <option value="8">
                                    8 imágenes
                                </option>

                                <option value="12">
                                    12 imágenes
                                </option>

                            </select>


                            <div
                                class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">

                                <svg
                                    class="h-5 w-5"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor">

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M19 9l-7 7-7-7" />

                                </svg>

                            </div>

                        </div>

                    </div>


                    <!-- BOTONES -->
                    <div class="flex gap-3">

                        <button
                            id="btn-search"
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3 px-6 rounded-xl shadow-md shadow-indigo-100 transition-all text-center tracking-wide">

                            Buscar Raza

                        </button>


                        <button
                            id="btn-random"
                            class="bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-medium py-3 px-5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                            title="Imágenes Aleatorias">

                            <span>🎲</span>

                            <span>
                                Aleatorio
                            </span>

                        </button>

                    </div>

                </div>

            </section>


            <!-- GALERÍA -->
            <section
                id="gallery"
                class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

                <div id="contenedor-perros" class="contents">

                </div>

            </section>

        </main>

    </div>


    <!-- PIE DE PÁGINA -->
    <footer
        class="bg-white text-center py-6 border-t border-slate-200 w-full mt-12">

        <p class="text-xs text-slate-500 font-medium">

            Interfaz responsiva construida con

            <span class="text-indigo-600">
                Tailwind CSS
            </span>

            • Conectada a la API pública de

            <a
                href="https://dog.ceo"
                target="_blank"
                class="text-slate-700 hover:text-indigo-600 underline transition-colors">

                Dog API

            </a>

        </p>

    </footer>


    <!-- LUCIDE -->
    <script src="https://unpkg.com/lucide@latest"></script>


    <!-- JAVASCRIPT PRINCIPAL -->
    <script type="module" src="./app.js"></script>


    <!-- ICONOS -->
    <script>
        lucide.createIcons();
    </script>

</body>

</html>
